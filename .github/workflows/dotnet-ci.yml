name: dotnet-ci

on:
  pull_request:
  push:

jobs:
  build-test:
    runs-on: windows-latest

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.302'

      - name: Check hidden Unicode controls
        shell: pwsh
        run: ./eng/check-hidden-unicode.ps1

      - name: Restore (locked)
        run: dotnet restore AdaptiveSpritesDMItool.sln --locked-mode

      - name: Build Debug
        run: dotnet build AdaptiveSpritesDMItool.sln --configuration Debug --no-restore

      - name: Build Release
        run: dotnet build AdaptiveSpritesDMItool.sln --configuration Release --no-restore

      - name: Test Release
        run: dotnet test AdaptiveSpritesDMItool.sln --configuration Release --no-build

      - name: Audit packages
        run: dotnet list AdaptiveSpritesDMItool.sln package --vulnerable --include-transitive

      - name: Package win-x64
        shell: pwsh
        run: ./eng/build-release.ps1 -Version v2.3.0 -Runtime win-x64 -SkipBuildVerification

      - name: Upload win-x64 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AdaptiveSpritesDMItool-v2.3.0-win-x64
          path: artifacts/release/AdaptiveSpritesDMItool-v2.3.0-win-x64.zip
